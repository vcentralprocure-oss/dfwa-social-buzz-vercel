<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Arlington Pulse...</title>
    <meta http-equiv="refresh" content="0; url=https://dfwasocialbuzz.com/arlington/">
    <link rel="canonical" href="https://dfwasocialbuzz.com/arlington/">
    <script>
        // Preserve subpath when redirecting
        var currentPath = window.location.pathname;
        var redirectUrl = "https://dfwasocialbuzz.com/arlington/";
        if (currentPath && currentPath !== "/") {
            // Remove leading slash and append to destination
            redirectUrl = "https://dfwasocialbuzz.com/arlington" + currentPath;
        }
        window.location.replace(redirectUrl);
    </script>
</head>
<body>
    <p>Redirecting to <a href="https://dfwasocialbuzz.com/arlington/">Arlington Pulse</a>...</p>
</body>
</html>
