<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Arlington Pulse</title>
    <meta name="description" content="{{DESCRIPTION}}">
    
    <!-- JSON-LD Structured Data - Auto-generated at build time -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0a0a14; 
            color: white; 
            line-height: 1.6; 
        }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        h1 { color: #FF6B35; margin-bottom: 1rem; }
        .meta { 
            color: #888; 
            font-size: 0.9rem; 
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333;
        }
        .content { 
            margin-top: 2rem;
            font-size: 1.1rem;
            line-height: 1.8;
        }
        .content p { margin-bottom: 1.5rem; }
        .content h2 { 
            color: #FF6B35; 
            margin: 2rem 0 1rem;
            font-size: 1.5rem;
        }
        .content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1.5rem 0;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #FF6B35;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/arlington/" class="back-link">← Back to Arlington Pulse</a>
        
        <article>
            <h1>{{TITLE}}</h1>
            <div class="meta">
                Published: {{DATE_PUBLISHED}} | Author: {{AUTHOR}}
            </div>

                {{CONTENT}}
            </div>
        </article>
